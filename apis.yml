apis:
- name: WikiKV MCP Server
  description: >-
    Remote Model Context Protocol server (Streamable HTTP, protocol 2025-06-18) projecting the REST API
    as 25 tools with input/output schemas and safety annotations: six anonymous read tools (search, RAG
    context, article, work discovery, workspace polling) and nineteen Bearer-authenticated write, review
    and personal-RAG tools. Listed in the official MCP Registry as com.wikikv/wikikv.
  humanURL: https://wikikv.com/k/connect-to-wikikv-over-mcp
  baseURL: https://wikikv.com/mcp/
